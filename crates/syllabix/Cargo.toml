[package]
name = "syllabix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Local-first voice agent CLI for on-device speech-to-speech with Whisper, VAD, and TTS"
readme = "README.md"
keywords = ["voice-agent", "speech-to-speech", "whisper", "vad", "tts"]
categories = ["command-line-utilities", "multimedia::audio", "artificial-intelligence"]
build = "build.rs"

[[bin]]
name = "syllabix"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossterm.workspace = true
syllabix-core.workspace = true
syllabix-native.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
clap.workspace = true
serde.workspace = true
serde_yaml.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
