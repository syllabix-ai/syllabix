[package]
name = "syllabix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared types, provider contracts, and in-memory conversation loop"

[features]
# Native inference fetches and executes the launch-model stack. Keep it
# opt-in so cross-platform build/test CI stays fast and network-independent.
native-inference = []

[dependencies]
thiserror.workspace = true
cpal.workspace = true
sha2.workspace = true
ureq.workspace = true
url.workspace = true
idna.workspace = true
zeroize.workspace = true
jobserver.workspace = true
getrandom.workspace = true
ort = "=2.0.0-rc.9"
ort-sys.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
tracing.workspace = true
syllabix-native.workspace = true
sonora.workspace = true
# Kokoro G2P: Misaki US lexicon in-process. default-features includes
# espeak-ng (GPL + extra dylib) — keep that off.
misaki-rs = { version = "=0.3.0", default-features = false }
# Pure-Rust SentencePiece reader for Pocket TTS's pinned tokenizer.model.
sentencepiece-rs = "=0.2.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
coreaudio-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "native_inference"
path = "tests/native_inference/main.rs"
required-features = ["native-inference"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
