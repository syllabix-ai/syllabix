[package]
name = "syllabix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Voice-agent SDK: shared types, provider contracts, and an in-memory speech-to-speech conversation loop"
readme = "README.md"
keywords = ["voice-agent", "speech-to-speech", "whisper", "vad", "tts"]
categories = ["multimedia::audio", "artificial-intelligence"]

[features]
# Same graph as `syllabix run`. The CLI and existing hosts keep this default.
default = ["full"]
# Session defaults, run_live, and load_real_providers (engines + devices + cloud LLM).
full = ["ggml", "device-audio", "cloud-llm"]
# Optional CMake build of whisper.cpp / llama.cpp via syllabix-native.
ggml = ["dep:syllabix-native"]
# Optional microphone/speaker I/O plus echo cancellation (ALSA headers on Linux).
device-audio = ["dep:cpal", "dep:sonora"]
# Cloud LLM variant in load_real_providers only. OpenAiLlm always compiles.
cloud-llm = []
# Turns on `ggml` plus the slow tests that download and run the real models
# (both GGUF and ONNX). ONNX support (`ort`) is always built in; this
# feature does not switch it on.
native-inference = ["ggml"]

[dependencies]
thiserror.workspace = true
cpal = { workspace = true, optional = true }
sha2.workspace = true
ureq.workspace = true
url.workspace = true
idna.workspace = true
zeroize.workspace = true
jobserver.workspace = true
getrandom.workspace = true
ort = "=2.0.0-rc.9"
ort-sys.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
htmd.workspace = true
tracing.workspace = true
syllabix-native = { workspace = true, optional = true }
sonora = { workspace = true, optional = true }
# Kokoro G2P: Misaki US lexicon in-process. default-features includes
# espeak-ng (GPL + extra dylib) — keep that off.
misaki-rs = { version = "=0.3.0", default-features = false }
# Pure-Rust SentencePiece reader for Pocket TTS's pinned tokenizer.model.
sentencepiece-rs = "=0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock LSM helpers for the Linux sandbox fallback (#125 Phase 3).
landlock = "=0.4.7"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
coreaudio-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "native_inference"
path = "tests/native_inference/main.rs"
required-features = ["native-inference"]

[[test]]
name = "audio_io"
path = "tests/audio_io.rs"
required-features = ["device-audio"]

[[test]]
name = "harness-quality"
path = "tests/harness-quality.rs"
required-features = ["ggml", "cloud-llm"]

[[example]]
name = "embed-loop"
required-features = ["full"]

[[example]]
name = "custom-llm"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
