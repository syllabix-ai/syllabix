[package]
name = "syllabix-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
rust-version.workspace = true
description = "Shared Syllabix types (errors, audio frames, model cache, ONNX helpers) and C++ engines behind the cpp feature"
readme = "README.md"
# Ship README, Apache-2.0 LICENSE, NOTICE, and the vendored engine trees
# (including their MIT LICENSE files). Keep mtmd-debug.h, miniaudio.h,
# stb_image.h, CMake files, and ggml-vulkan feature-tests shaders.
# The ! lines skip upstream tests/examples/pocs and model blobs if those
# ever land in vendor/; they do not match feature-tests/.
include = [
    "src/**",
    "include/**",
    "build.rs",
    "CMakeLists.txt",
    "LICENSE",
    "NOTICE",
    "README.md",
    "vendor/README.md",
    "vendor/llama.cpp/**",
    "vendor/whisper.cpp/**",
    "!vendor/**/tests/**",
    "!vendor/**/examples/**",
    "!vendor/**/pocs/**",
    "!vendor/**/*.gguf",
    "!vendor/**/*.bin",
    "!vendor/**/*.onnx",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(syllabix_ggml_vulkan)'] }

[lib]
path = "src/lib.rs"

[features]
default = ["cpp"]
# The vendored ggml, whisper.cpp and llama.cpp engines, built with CMake.
cpp = ["dep:cc", "dep:cmake", "dep:walkdir"]
# Checksummed HTTPS model cache used by the speech crates.
models = ["dep:sha2", "dep:ureq"]
# ONNX Runtime helpers used by Moonshine, Pocket, and Kokoro.
onnx = ["dep:ort", "dep:ort-sys"]

[dependencies]
thiserror.workspace = true
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.9", optional = true }
ort-sys = { workspace = true, optional = true }

[build-dependencies]
cc = { version = "=1.2.46", optional = true }
cmake = { version = "=0.1.58", optional = true }
walkdir = { version = "=2.5.0", optional = true }
