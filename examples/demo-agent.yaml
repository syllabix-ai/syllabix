# Minimal example. Copy as syllabix.yaml, or run `syllabix init`.
# `syllabix run` needs no yaml. Menu of keys: docs/configuration.md
name: demo-agent
pipeline:
  vad:
    provider: silero
  stt:
    provider: local
    model: whisper-small
    language: en
  llm:
    provider: local
    model: lfm2.5-2.6b
  tts:
    provider: local
    model: pocket-tts

# Optional idle timers (defaults shown). Set either value to 0 to disable it.
# auto-timeout:
#   mic_mute_ms: 180000
#   exit_ms: 600000
