# Minimal example. Copy as syllabix.yaml, or run `syllabix init`.
# `syllabix run` needs no yaml. Menu of keys: docs/configuration.md
name: demo-agent
pipeline:
  vad:
    provider: silero
  stt:
    provider: whisper.cpp
    model: small
    language: en
  llm:
    provider: local
    model: llama-3.2-1b
  tts:
    provider: local
    model: pocket-tts
