name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SYLLABIX_CACHE_DIR: ${{ github.workspace }}/.syllabix-cache

jobs:
  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Use the PR head so reported lines map to the submitted diff.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: llvm-tools-preview
      - name: Install ALSA headers and CMake
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.syllabix-cache
          key: syllabix-models-v1-${{ runner.os }}-whisper-small-llama-3.2-1b-kokoro-v1
      # Keep cargo-llvm-cov aligned with DEVELOPMENT.md and local verification.
      # `--cfg coverage` skips whisper.cpp / llama.cpp / Kokoro weight loads.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - name: Run unit tests with coverage
        run: cargo llvm-cov --workspace --fail-under-lines 85 --cobertura --output-path coverage.xml
      - name: Store coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage.xml
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - name: Install ALSA headers and CMake
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extra_target: ""
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extra_target: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}${{ matrix.extra_target != '' && format(',{0}', matrix.extra_target) || '' }}
      - name: Install ALSA headers and CMake
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - name: Install CMake
        if: runner.os == 'macOS'
        run: brew install cmake
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.syllabix-cache
          key: syllabix-models-v1-${{ runner.os }}-whisper-small-llama-3.2-1b-kokoro-v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Unit and CLI tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Release compile
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Cross-compile macOS Intel
        if: matrix.extra_target != ''
        run: cargo build --workspace --release --target ${{ matrix.extra_target }}
      - name: Check undeclared dynamic libraries
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-dynamic-libs.sh
          scripts/check-dynamic-libs.sh "target/${{ matrix.target }}/release/syllabix"
      - name: Check one shared ggml
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-one-ggml.sh
          scripts/check-one-ggml.sh "target/${{ matrix.target }}/release/syllabix"
