name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips every job (the `if` guards below), and
    # marking it ready fires only this type — without it the PR keeps the
    # stale SKIPPED checks until the next push. Keep the default types.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Superseded runs (multiple pushes per branch) are cancelled so they stop
# consuming runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SYLLABIX_CACHE_DIR: ${{ github.workspace }}/.syllabix-cache

jobs:
  # Fast per-PR gate. OS-agnostic: GitHub-hosted Linux is unlimited for
  # public repositories. fmt / clippy / coverage run in parallel.
  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    # Headroom for a cold instrumented build (vendored C++ + all deps).
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      # Use the PR head so reported lines map to the submitted diff.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: llvm-tools-preview
      - name: Compile dependencies (Linux)
        run: ./scripts/setup-linux.sh
      # Ubuntu 24.04 AppArmor blocks CAP_NET_ADMIN inside unprivileged userns,
      # so bwrap --unshare-net fails with RTM_NEWADDR and sandbox tests fail.
      - name: Allow bubblewrap user namespaces
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # No model-weights cache here: cfg(coverage) never loads weights (all
      # native modules are gated off in native_inference), so nothing can
      # fill .syllabix-cache. weekly.yml keeps its cache for real inference.
      # Keep cargo-llvm-cov aligned with DEVELOPMENT.md and local verification.
      # `--cfg coverage` skips whisper.cpp / llama.cpp / Kokoro weight loads.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@v2
      # Do not merge coverage profiles left by an earlier retry on a reused
      # runner; build artifacts remain cached.
      - name: Clear stale coverage profiles
        run: |
          if [ -d target/llvm-cov-target ]; then
            find target/llvm-cov-target -type f \( -name '*.profraw' -o -name '*.profdata' \) -delete
          fi
      - name: Run unit tests with coverage
        # Native inference is an opt-in integration suite. Keep it out of this
        # unit-coverage gate: it is neither a model run nor unit-test coverage.
        run: cargo llvm-cov --no-clean --workspace --fail-under-lines 85 --fail-under-file-lines 85 --cobertura --output-path coverage.xml
      - name: Store coverage report
        # Best-effort evidence: the >=85% gate is enforced by the run step
        # above, so a stalled artifact upload must not fail a green run.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cobertura
          path: coverage.xml
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - name: Compile dependencies (Linux)
        run: ./scripts/setup-linux.sh
      - name: Allow bubblewrap user namespaces
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Harness sandbox admission (real bwrap; skipped under cfg coverage)
        run: cargo test -p syllabix-core --test harness-quality harness_sandbox_admission -- --nocapture
      - name: chat template golden tests (common chat apply/parse)
        run: cargo test -p syllabix-native --test chat_template_golden
      - name: cargo check ggml without cloud
        run: cargo check -p syllabix-core --no-default-features --features ggml --all-targets

  # Lane 3 hosts that set default-features = false must compile without the
  # CMake / whisper.cpp toolchain. This job does not run setup-linux.sh and hides cmake.
  sdk-no-native:
    name: sdk no-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-no-native
      - name: Hide CMake
        run: |
          sudo rm -f /usr/bin/cmake /usr/local/bin/cmake
          hash -r || true
          if command -v cmake >/dev/null 2>&1; then
            echo "cmake still on PATH at $(command -v cmake)" >&2
            exit 1
          fi
          echo "cmake is not on PATH"
      - name: cargo check syllabix-core without default features
        run: cargo check -p syllabix-core --no-default-features --all-targets
      - name: cargo check cloud without CMake / whisper.cpp
        run: cargo check -p syllabix-core --no-default-features --features cloud --all-targets
      - name: cargo test supported API without default features
        run: cargo test -p syllabix-core --no-default-features --test supported_api -- --nocapture

  # Dry-run the crates.io tarballs on every PR. Linux only: the native
  # verify step compiles C++, and other OSes would only repeat that cost.
  crates-io-package:
    name: crates.io package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Compile dependencies (Linux)
        run: ./scripts/setup-linux.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: crates-io-package
      - name: Package syllabix-native (verify from tarball)
        run: |
          cargo package -p syllabix-native
          crate="$(echo target/package/syllabix-native-*.crate)"
          size="$(stat -c%s "$crate")"
          echo "syllabix-native .crate is ${size} bytes"
          # crates.io default crate size limit is 10 MB (10485760 bytes).
          if [ "$size" -gt 10485760 ]; then
            echo "syllabix-native .crate exceeds 10485760 bytes: ${size}" >&2
            exit 1
          fi
      - name: List syllabix-core package (no verify)
        # syllabix-core depends on syllabix-native by version. cargo package
        # --verify would try to download that version from crates.io, which
        # is not there until a version tag publishes native first. Listing
        # the tarball is enough on PRs; native is the crate that must build
        # from the packaged files.
        run: cargo package -p syllabix-core --no-verify --list

  # Real-weight native inference is native-tests.yml (PRs, main, and
  # manual dispatch). The cross-platform test matrix (linux/windows/macos
  # + Intel cross-build) lives in weekly.yml: scheduled Mondays or on
  # demand via workflow_dispatch.
  # Dist packaging and GitHub Release attach remain in release.yml (v* tags
  # only). crates.io publish is crates-io.yml (also v* tags). PR CI still
  # does not package dist binaries.
