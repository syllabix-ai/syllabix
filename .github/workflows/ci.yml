name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pool:
        description: "Runner pool for the fast checks (default: self-hosted, free)"
        type: choice
        default: '["self-hosted", "macOS"]'
        options:
          - '["self-hosted", "macOS"]'
          - '["ubuntu-latest"]'

# Superseded runs (multiple pushes per branch) are cancelled so they stop
# consuming runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SYLLABIX_CACHE_DIR: ${{ github.workspace }}/.syllabix-cache

jobs:
  # Fast per-PR gate. OS-agnostic, runs on the self-hosted macOS runner
  # (0 billed Actions minutes); workflow_dispatch may override to hosted.
  coverage:
    name: code coverage
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      # Use the PR head so reported lines map to the submitted diff.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: llvm-tools-preview
      - name: Install ALSA headers and CMake
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - name: Ensure CMake (no-op when preinstalled on the runner)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.syllabix-cache
          key: syllabix-models-v2-${{ runner.os }}-whisper-small-qwen3.5-0.8b-qwen3.5-2b-llama-3.2-1b-kokoro-v1
      # Keep cargo-llvm-cov aligned with DEVELOPMENT.md and local verification.
      # `--cfg coverage` skips whisper.cpp / llama.cpp / Kokoro weight loads.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      # Coverage now runs on macOS (self-hosted) instead of hosted Linux; the
      # Linux baseline is re-checked weekly in weekly.yml (coverage-linux).
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests with coverage
        run: cargo llvm-cov --workspace --fail-under-lines 85 --cobertura --output-path coverage.xml
      - name: Store coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage.xml
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - name: Install ALSA headers and CMake
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - name: Ensure CMake (no-op when preinstalled on the runner)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The cross-platform test matrix (linux/windows/macos + Intel cross-build)
  # moved to weekly.yml: scheduled Mondays or on demand via workflow_dispatch.
  # It bills GitHub Actions minutes (~80-90/run), so it no longer runs on
  # every push/PR. Dist packaging and GitHub Release attach remain in
  # release.yml (v* tags only). PR CI still does not package dist binaries.
