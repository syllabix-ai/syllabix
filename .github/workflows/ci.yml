name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: clippy
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extra_target: ""
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extra_target: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: ${{ matrix.target }}${{ matrix.extra_target != '' && format(',{0}', matrix.extra_target) || '' }}
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Unit and CLI tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Release compile
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Cross-compile macOS Intel
        if: matrix.extra_target != ''
        run: cargo build --workspace --release --target ${{ matrix.extra_target }}
      - name: Check undeclared dynamic libraries
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-dynamic-libs.sh
          scripts/check-dynamic-libs.sh "target/${{ matrix.target }}/release/syllabix"
