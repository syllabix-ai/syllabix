name: Git consumer

# Check that another repo can depend on syllabix-core from git and compile the
# embed examples. Release tags pin a tag. Pull requests and main pin the
# commit under test, because that commit is not tagged yet.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SYLLABIX_CACHE_DIR: ${{ github.workspace }}/.syllabix-cache

jobs:
  git-consumer:
    name: git-consumer
    runs-on: ubuntu-latest
    # Same 25-minute cap as clippy. Most of the time is compiling the native C++ library.
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      # Use the pull request head commit, not GitHub's merge commit. Cargo later
      # fetches this SHA from GitHub; the merge commit is not on a cloneable branch.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Compile dependencies (Linux)
        run: ./scripts/setup-linux.sh
      - name: Write dummy crate (git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SYLLABIX_GIT_URL: https://github.com/${{ github.repository }}.git
          SYLLABIX_GIT_TAG: ${{ github.ref_name }}
        run: ./scripts/ci-git-consumer.sh --prepare
      # On pull requests, clone from the head repo (the fork, when this is a
      # fork PR) so that SHA exists for cargo.
      - name: Write dummy crate (git commit)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          SYLLABIX_GIT_URL: https://github.com/${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}.git
          SYLLABIX_GIT_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-git-consumer.sh --prepare
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: target/git-consumer
      - name: cargo check embed examples as git consumer
        run: ./scripts/ci-git-consumer.sh --check
