name: Release

# Tags publish a release; manual runs package artifacts without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  package:
    name: dist artifact / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Compile dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh
      - name: Compile dependencies (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-dist-${{ matrix.name }}
      - name: Package dist artifact
        shell: bash
        run: |
          chmod +x scripts/package-release.sh scripts/check-clean-artifact.sh scripts/write-sha256sums.sh
          scripts/package-release.sh "${{ matrix.target }}"
          sidecar="$(ls dist/*.repro.json)"
          artifact="${sidecar%.repro.json}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            chmod +x scripts/check-dynamic-libs.sh scripts/check-one-ggml.sh
            scripts/check-dynamic-libs.sh "${artifact}"
            scripts/check-one-ggml.sh "${artifact}"
          fi
          scripts/check-clean-artifact.sh "${artifact}"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Combined SHA256SUMS
        run: |
          chmod +x scripts/write-sha256sums.sh
          scripts/write-sha256sums.sh dist
          ls -l dist
          test -s dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=(dist/syllabix-Linux-x86_64 dist/syllabix-Darwin-arm64 dist/syllabix-Darwin-x86_64 dist/syllabix-Windows-x86_64.exe dist/SHA256SUMS)
          for f in "${files[@]}"; do
            test -f "${f}"
          done
          shopt -s nullglob
          sidecars=(dist/*.repro.json)
          # Tag pushes / re-runs can race a UI-created empty release for the
          # same tag; replace it so publish stays idempotent without deleting
          # the git tag (--cleanup-tag is intentionally omitted).
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes
          fi
          gh release create "${tag}" \
            "${files[@]}" \
            "${sidecars[@]}" \
            --title "${tag}" \
            --notes "Single-file Syllabix binaries. Download for your OS, chmod +x, then \`./syllabix run\`. Weights fetch on first run into the local cache. Verify with SHA256SUMS. No Python, pip, or API key."
