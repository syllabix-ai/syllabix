name: Release

# Tags publish a GitHub Release. Manual runs package artifacts and, unless
# release_name is set, publish nothing. Do not create the release in the
# GitHub UI: this workflow has to create it. Immutable releases lock a
# tag name forever once published, even if you delete the release later.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: >-
          Recovery GitHub Release name, for example app-v0.1.1. Use this
          when the v* tag name was already used by a published release.
          Leave empty to package artifacts without publishing. Must not
          start with v.
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  package:
    name: dist artifact / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Compile dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh
      - name: Compile dependencies (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-dist-${{ matrix.name }}
      # Each OS runner checks out the repo independently. Rewrite here,
      # before the dist build, so every artifact reports the release
      # version. The edit is not committed.
      - name: Set crate versions from tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_name || '' }}
        run: |
          if [[ "${EVENT_NAME}" == "push" && "${REF}" == refs/tags/v* ]]; then
            python3 scripts/set-crate-versions.py --from-tag "${REF_NAME}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            name="$(printf '%s' "${RELEASE_NAME:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -n "${name}" ]]; then
              python3 scripts/set-crate-versions.py --from-release-name "${name}"
            else
              # Package-only manual run: leave Cargo.toml at the checkout version.
              python3 scripts/set-crate-versions.py --print-current
            fi
          else
            echo "unexpected event ${EVENT_NAME} ref ${REF}" >&2
            exit 1
          fi
      - name: Package dist artifact
        shell: bash
        run: |
          chmod +x scripts/package-release.sh scripts/check-clean-artifact.sh scripts/write-sha256sums.sh
          scripts/package-release.sh "${{ matrix.target }}"
          sidecar="$(ls dist/*.repro.json)"
          artifact="${sidecar%.repro.json}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            chmod +x scripts/check-dynamic-libs.sh scripts/check-one-ggml.sh
            scripts/check-dynamic-libs.sh "${artifact}"
            scripts/check-one-ggml.sh "${artifact}"
          fi
          # VERSION is set by the previous step via GITHUB_ENV (tag, recovery
          # name, or the checkout version on a package-only run).
          EXPECTED_VERSION="${VERSION:?missing VERSION from Set crate versions}" \
            scripts/check-clean-artifact.sh "${artifact}"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Tag pushes always publish. A manual run publishes only when
  # release_name is set (recovery for a burned tag name). An empty
  # manual run still packages artifacts and skips this job.
  publish:
    name: GitHub Release
    needs: package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Combined SHA256SUMS
        run: |
          chmod +x scripts/write-sha256sums.sh
          scripts/write-sha256sums.sh dist
          ls -l dist
          test -s dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          # Immutable releases: GitHub never lets a published tag name come
          # back. Deleting a published release and creating it again fails
          # with HTTP 422. Never call `gh release delete`. Create as a draft,
          # attach files, then publish so the release is complete before it
          # locks.
          notes="Single-file Syllabix binaries. Download for your OS, chmod +x, then \`./syllabix run\`. Weights fetch on first run into the local cache. Verify with SHA256SUMS. No Python, pip, or API key."
          files=(dist/syllabix-Linux-x86_64 dist/syllabix-Darwin-arm64 dist/syllabix-Darwin-x86_64 dist/syllabix-Windows-x86_64.exe dist/SHA256SUMS)
          for f in "${files[@]}"; do
            test -f "${f}"
          done
          shopt -s nullglob
          sidecars=(dist/*.repro.json)

          # A brand-new draft can 404 for a second or two when we try to
          # publish it. Retry instead of failing the whole release.
          publish_now() {
            local tag="$1"
            local n=0
            while (( n < 5 )); do
              if gh release edit "${tag}" --draft=false; then
                return 0
              fi
              n=$((n + 1))
              echo "could not publish ${tag} yet (try ${n}/5); waiting for the draft to show up"
              sleep 2
            done
            echo "gave up publishing ${tag}" >&2
            return 1
          }

          publish_draft() {
            local tag="$1"
            shift
            gh release create "${tag}" \
              "${files[@]}" \
              "${sidecars[@]}" \
              --draft \
              --title "${tag}" \
              --notes "${notes}" \
              "$@"
            publish_now "${tag}"
          }

          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            # Spaces-only is the same as leaving the box empty: package only.
            tag="$(printf '%s' "${RELEASE_NAME:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -z "${tag}" ]]; then
              echo "release_name is empty; packaging artifacts only"
              exit 0
            fi
            # A name starting with v would create a v* tag and fire
            # crates-io.yml and this workflow again.
            if [[ "${tag}" == v* ]]; then
              echo "release_name '${tag}' starts with v. Use a name like app-v0.1.1 so GitHub does not create another v* tag (that would start both release workflows again)." >&2
              exit 1
            fi
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "A GitHub Release named ${tag} already exists. Pick a different release_name." >&2
              exit 1
            fi
            # Point the new name at the commit this run was started on
            # (the maintainer picks the original tag in the Run workflow menu).
            publish_draft "${tag}" --target "${GITHUB_SHA}"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" == true ]]; then
              # A leftover draft can still receive files; publishing it then locks it.
              gh release upload "${tag}" "${files[@]}" "${sidecars[@]}" --clobber
              publish_now "${tag}"
              exit 0
            fi
            echo "A published GitHub Release already exists for ${tag}." >&2
            echo "Someone created it by hand in the GitHub Releases page. This workflow has to create the release itself so the binaries are attached before GitHub locks the name." >&2
            echo "Once a name is used for a published release, GitHub never lets that name come back." >&2
            echo "Next time, push only the tag and let this workflow create the release." >&2
            exit 1
          fi

          publish_draft "${tag}"

  # After a version tag publishes, open a PR that syncs the release-tag
  # pins in the install docs to that tag. The docs use exact tags because
  # Cargo has no "latest tag" syntax; without this job the pins go stale
  # one release later. A human still merges the PR (never auto-merged).
  sync-pins:
    name: Open release-pins PR
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A tag push checks out the tag; the pins live on main.
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Sync pins and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ./scripts/sync-release-pins.sh "${tag}"
          if git diff --quiet; then
            echo "release pins already in sync for ${tag}"
            exit 0
          fi
          branch="docs/release-pins-${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch into the remote-tracking ref so --force-with-lease below
          # compares against the remote branch instead of overwriting it
          # blindly (a bare `git fetch origin <branch>` only writes
          # FETCH_HEAD, which the lease does not check).
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null || true
          git checkout -B "${branch}"
          # Stage whatever the script changed: the file list lives in the
          # script, so a second copy here could silently drop a file.
          git add -u
          git commit -m "Sync release pins to ${tag}" -m "Automated by the sync-pins job in release.yml. Merge after the ${tag} release."
          git push --force-with-lease origin "${branch}"
          if [ "$(gh pr list --head "${branch}" --json number --jq 'length')" -gt 0 ]; then
            echo "pins PR already open for ${tag}"
          else
            # Each body line is its own quoted argument starting right after
            # the quote, so the generated body has flush-left headings.
            # (Indenting a multi-line "--body \"...\"" string would indent
            # the headings too, and `pr template check` anchors on `^##`.
            # A flush-left heredoc is not an option either: column-0 lines
            # terminate the YAML `|` block.)
            body="$(printf '%s\n' \
              '# Pull request' \
              '' \
              '## What changed' \
              '' \
              "Automated pin sync to ${tag} via \`scripts/sync-release-pins.sh\` after the ${tag} tag push. Review the pin diff, then merge." \
              '' \
              '## How verified' \
              '' \
              '- [x] `cargo fmt --all -- --check`' \
              '- [x] `cargo clippy --workspace --all-targets -- -D warnings`' \
              '' \
              '## Harness-quality evidence' \
              '' \
              '- [ ] Harness quality check run manually (needed only if related files are touched, see `docs/contributing.md`).' \
              '' \
              '## AI attribution' \
              '' \
              'AI-Agent: none' \
              'AI-Model: N/A')"
            gh pr create --base main --head "${branch}" \
              --title "Sync release pins to ${tag}" \
              --body "${body}"
          fi
