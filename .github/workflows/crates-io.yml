name: crates.io

# Publish syllabix-native, then syllabix-stt and syllabix-tts, then
# syllabix-core when a version tag is pushed.
# GitHub Release binaries stay in release.yml; this workflow only talks to
# crates.io. Pull requests never publish. A manual run from the Actions tab
# is always a dry run: it never uploads and never uses a token.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. v0.1.1"
        required: true
        type: string

concurrency:
  group: crates-io-${{ github.event_name }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # rust-lang/crates-io-auth-action exchanges this OIDC token for a
      # short-lived crates.io token. Only the push auth step below requests it.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Compile dependencies (Linux)
        run: ./scripts/setup-linux.sh

      # Version comes from the git tag (vX.Y.Z → X.Y.Z), or from the
      # workflow_dispatch tag input on a dry run. Written into Cargo.toml
      # for this job only; do not bump versions in a commit.
      # Same rewrite as release.yml (scripts/set-crate-versions.py).
      - name: Set crate versions from tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/set-crate-versions.py --from-tag "${RELEASE_TAG}"

      - name: Dry-run publish all four crates
        if: github.event_name == 'workflow_dispatch'
        run: |
          # --allow-dirty: this job writes the tag version into Cargo.toml
          # (and matching Cargo.lock workspace crate versions). That edit is
          # not committed. --dry-run builds each crate from its packaged
          # tarball and does not upload. One call for all four: cargo builds
          # stt, tts and core against the native/stt/tts tarballs from this
          # run, not crates.io.
          cargo publish --dry-run --locked --allow-dirty \
            -p syllabix-native -p syllabix-stt -p syllabix-tts -p syllabix-core

      # Tag push only. A manual dry run never uploads and must not request
      # a crates.io token.
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: github.event_name == 'push'
        uses: rust-lang/crates-io-auth-action@v1

      # Native first: stt, tts and core depend on it by version.
      - name: Publish syllabix-native
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "no crates.io token from trusted publishing" >&2
            exit 1
          fi
          # A re-run after a successful upload would fail: crates.io never
          # overwrites a version. Skip when this crate+version is already there.
          url="https://crates.io/api/v1/crates/syllabix-native/${VERSION}"
          code=$(curl -sS -o /tmp/crates-io.json -w "%{http_code}" \
            -A "syllabix-ai/syllabix (https://github.com/syllabix-ai/syllabix)" \
            "${url}")
          if [ "${code}" = "200" ]; then
            echo "syllabix-native ${VERSION} is already on crates.io; skipping publish"
            exit 0
          fi
          if [ "${code}" != "404" ]; then
            echo "could not check crates.io for syllabix-native ${VERSION}: HTTP ${code}" >&2
            cat /tmp/crates-io.json >&2 || true
            exit 1
          fi
          # --allow-dirty: this job writes the tag version into Cargo.toml
          # (and matching Cargo.lock workspace crate versions). That edit is
          # not committed.
          cargo publish -p syllabix-native --locked --allow-dirty

      # The index can lag the upload. Wait until this version is visible
      # before publishing stt, tts and core, otherwise cargo publish fails
      # to resolve syllabix-native.
      - name: Wait until syllabix-native is on crates.io
        if: github.event_name == 'push'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          deadline=$((SECONDS + 600))
          while true; do
            if cargo info -q "syllabix-native@${VERSION}" --registry crates-io >/dev/null 2>&1; then
              echo "syllabix-native ${VERSION} is on crates.io"
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "timed out waiting for syllabix-native ${VERSION} on crates.io" >&2
              exit 1
            fi
            echo "waiting for syllabix-native ${VERSION}..."
            sleep 15
          done

      # stt and tts depend only on syllabix-native, so their order does not matter.
      - name: Publish syllabix-stt and syllabix-tts
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          for crate in syllabix-stt syllabix-tts; do
            # Same skip as native: a re-run must not fail after a successful upload.
            url="https://crates.io/api/v1/crates/${crate}/${VERSION}"
            code=$(curl -sS -o /tmp/crates-io.json -w "%{http_code}" \
              -A "syllabix-ai/syllabix (https://github.com/syllabix-ai/syllabix)" \
              "${url}")
            if [ "${code}" = "200" ]; then
              echo "${crate} ${VERSION} is already on crates.io; skipping publish"
              continue
            fi
            if [ "${code}" != "404" ]; then
              echo "could not check crates.io for ${crate} ${VERSION}: HTTP ${code}" >&2
              cat /tmp/crates-io.json >&2 || true
              exit 1
            fi
            # --no-verify: same reason as core below. PR CI already built
            # this crate from its tarball (cargo package in ci.yml).
            cargo publish -p "${crate}" --locked --no-verify --allow-dirty
          done

      # Same wait as native: core's publish must resolve stt and tts.
      - name: Wait until syllabix-stt and syllabix-tts are on crates.io
        if: github.event_name == 'push'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          deadline=$((SECONDS + 600))
          for crate in syllabix-stt syllabix-tts; do
            while ! cargo info -q "${crate}@${VERSION}" --registry crates-io >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "timed out waiting for ${crate} ${VERSION} on crates.io" >&2
                exit 1
              fi
              echo "waiting for ${crate} ${VERSION}..."
              sleep 15
            done
            echo "${crate} ${VERSION} is on crates.io"
          done

      - name: Publish syllabix-core
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          # Same skip as native: a re-run must not fail after a successful upload.
          url="https://crates.io/api/v1/crates/syllabix-core/${VERSION}"
          code=$(curl -sS -o /tmp/crates-io.json -w "%{http_code}" \
            -A "syllabix-ai/syllabix (https://github.com/syllabix-ai/syllabix)" \
            "${url}")
          if [ "${code}" = "200" ]; then
            echo "syllabix-core ${VERSION} is already on crates.io; skipping publish"
            exit 0
          fi
          if [ "${code}" != "404" ]; then
            echo "could not check crates.io for syllabix-core ${VERSION}: HTTP ${code}" >&2
            cat /tmp/crates-io.json >&2 || true
            exit 1
          fi
          # --no-verify: the packaged core crate depends on syllabix-native,
          # syllabix-stt and syllabix-tts by version only. Verify would
          # rebuild them from crates.io; the native publish step already
          # built this workspace, and PR CI already verified all four
          # tarballs.
          cargo publish -p syllabix-core --locked --no-verify --allow-dirty
