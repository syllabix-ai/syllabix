name: crates.io

# Publish syllabix-native then syllabix-core when a version tag is pushed.
# GitHub Release binaries stay in release.yml; this workflow only talks to
# crates.io. Pull requests never publish. A manual run from the Actions tab
# is always a dry run: it never uploads and never uses a token.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. v0.1.1"
        required: true
        type: string

concurrency:
  group: crates-io-${{ github.event_name }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Trusted publishing later: rust-lang/crates-io-auth-action exchanges
      # this OIDC token for a short-lived crates.io token. Only the push
      # auth step below requests it.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Compile dependencies (Linux)
        run: ./scripts/setup-linux.sh

      # Version comes from the git tag (vX.Y.Z → X.Y.Z), or from the
      # workflow_dispatch tag input on a dry run. Written into Cargo.toml
      # for this job only; do not bump versions in a commit.
      - name: Set crate versions from tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ.get("RELEASE_TAG", "")
          if not tag.startswith("v"):
              sys.exit(f"tag {tag!r} must start with v")
          version = tag[1:]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              sys.exit(f"tag {tag!r} is not a plain vX.Y.Z version")

          root = pathlib.Path("Cargo.toml")
          text = root.read_text()
          lines = text.splitlines(keepends=True)
          in_pkg = False
          replaced_pkg = False
          out = []
          for line in lines:
              if line.strip() == "[workspace.package]":
                  in_pkg = True
                  out.append(line)
                  continue
              if in_pkg and line.startswith("["):
                  in_pkg = False
              if in_pkg and re.match(r"^version\s*=", line) and not replaced_pkg:
                  out.append(f'version = "{version}"\n')
                  replaced_pkg = True
                  continue
              out.append(line)
          if not replaced_pkg:
              sys.exit("could not find [workspace.package] version")
          text = "".join(out)
          text, n = re.subn(
              r'syllabix-native = \{ path = "crates/syllabix-native", version = "[^"]+" \}',
              f'syllabix-native = {{ path = "crates/syllabix-native", version = "{version}" }}',
              text,
              count=1,
          )
          if n != 1:
              sys.exit("could not find syllabix-native version requirement")
          root.write_text(text)

          # Keep Cargo.lock in sync so `cargo publish --locked` still works.
          lock_path = pathlib.Path("Cargo.lock")
          names = {"syllabix", "syllabix-core", "syllabix-native"}
          lock_out = []
          pending = None
          lock_n = 0
          for line in lock_path.read_text().splitlines(keepends=True):
              m = re.match(r'^name = "([^"]+)"\s*$', line)
              if m and m.group(1) in names:
                  pending = m.group(1)
                  lock_out.append(line)
                  continue
              if pending and re.match(r"^version = ", line):
                  lock_out.append(f'version = "{version}"\n')
                  lock_n += 1
                  pending = None
                  continue
              pending = None
              lock_out.append(line)
          if lock_n != 3:
              sys.exit(f"expected 3 workspace crate versions in Cargo.lock, got {lock_n}")
          lock_path.write_text("".join(lock_out))

          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a", encoding="utf-8") as fh:
              fh.write(f"VERSION={version}\n")
          print(f"tag={tag} publish_version={version}")
          PY

      - name: Dry-run publish syllabix-native
        if: github.event_name == 'workflow_dispatch'
        run: |
          # --allow-dirty: this job writes the tag version into Cargo.toml
          # (and matching Cargo.lock workspace crate versions). That edit is
          # not committed. --dry-run builds from the packaged tarball and
          # does not upload.
          cargo publish -p syllabix-native --dry-run --locked --allow-dirty

      - name: List syllabix-core package
        if: github.event_name == 'workflow_dispatch'
        # cargo publish --dry-run for core would try to download this version
        # of syllabix-native from crates.io. Core cannot be fully dry-run
        # until that version is on crates.io, so this only lists the tarball.
        run: cargo package -p syllabix-core --allow-dirty --no-verify --list

      # Boolean via env: GitHub does not allow secrets in `if:`. This step
      # (and the secret) only runs on a tag push, never on a dry run.
      - name: Detect crates.io token
        id: token
        if: github.event_name == 'push'
        env:
          HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: echo "has=${HAS_CARGO_REGISTRY_TOKEN}" >> "$GITHUB_OUTPUT"

      # Prefer a stored API token (needed for the first publish, before
      # trusted publishing can be configured for the crate). If that secret
      # is empty, exchange GitHub OIDC for a crates.io token.
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: github.event_name == 'push' && steps.token.outputs.has != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      # Native first: core's crates.io Cargo.toml depends on it by version.
      - name: Publish syllabix-native
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "no crates.io token: set CARGO_REGISTRY_TOKEN or trusted publishing" >&2
            exit 1
          fi
          # A re-run after a successful upload would fail: crates.io never
          # overwrites a version. Skip when this crate+version is already there.
          url="https://crates.io/api/v1/crates/syllabix-native/${VERSION}"
          code=$(curl -sS -o /tmp/crates-io.json -w "%{http_code}" \
            -A "syllabix-ai/syllabix (https://github.com/syllabix-ai/syllabix)" \
            "${url}")
          if [ "${code}" = "200" ]; then
            echo "syllabix-native ${VERSION} is already on crates.io; skipping publish"
            exit 0
          fi
          if [ "${code}" != "404" ]; then
            echo "could not check crates.io for syllabix-native ${VERSION}: HTTP ${code}" >&2
            cat /tmp/crates-io.json >&2 || true
            exit 1
          fi
          # --allow-dirty: this job writes the tag version into Cargo.toml
          # (and matching Cargo.lock workspace crate versions). That edit is
          # not committed.
          cargo publish -p syllabix-native --locked --allow-dirty

      # The index can lag the upload. Wait until this version is visible
      # before publishing core, otherwise cargo publish -p syllabix-core
      # fails to resolve syllabix-native.
      - name: Wait until syllabix-native is on crates.io
        if: github.event_name == 'push'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          deadline=$((SECONDS + 600))
          while true; do
            if cargo info -q "syllabix-native@${VERSION}" --registry crates-io >/dev/null 2>&1; then
              echo "syllabix-native ${VERSION} is on crates.io"
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "timed out waiting for syllabix-native ${VERSION} on crates.io" >&2
              exit 1
            fi
            echo "waiting for syllabix-native ${VERSION}..."
            sleep 15
          done

      - name: Publish syllabix-core
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          # Same skip as native: a re-run must not fail after a successful upload.
          url="https://crates.io/api/v1/crates/syllabix-core/${VERSION}"
          code=$(curl -sS -o /tmp/crates-io.json -w "%{http_code}" \
            -A "syllabix-ai/syllabix (https://github.com/syllabix-ai/syllabix)" \
            "${url}")
          if [ "${code}" = "200" ]; then
            echo "syllabix-core ${VERSION} is already on crates.io; skipping publish"
            exit 0
          fi
          if [ "${code}" != "404" ]; then
            echo "could not check crates.io for syllabix-core ${VERSION}: HTTP ${code}" >&2
            cat /tmp/crates-io.json >&2 || true
            exit 1
          fi
          # --no-verify: the packaged core crate depends on syllabix-native
          # by version only. Verify would rebuild from crates.io; the native
          # publish step already built this workspace, and PR CI already
          # verified the native tarball.
          cargo publish -p syllabix-core --locked --no-verify --allow-dirty
