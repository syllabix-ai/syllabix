name: PR template check

# The PR template is only a default body: `gh pr create --body`, the API,
# or the UI template-chooser bypass it silently. This check parses the PR
# body and fails until it follows `.github/pull_request_template.md`
# (non-empty What changed, How verified with checked boxes).
# It also enforces the single-commit rule: squash the PR
# branch to one commit before pushing (re-squash after fixes).
# The harness checkbox is excluded: harness-quality-evidence.yml enforces
# it based on the files changed.
# Informational until added as a required status check.
on:
  pull_request:
    # `edited` is required: fixing the body edits it without pushing, and
    # only a re-run can turn the check green.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pool:
        description: "Runner pool (default: self-hosted, free)"
        type: choice
        default: '["self-hosted", "macOS"]'
        options:
          - '["self-hosted", "macOS"]'
          - '["ubuntu-latest"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-template-check:
    name: pr template check
    # Single runner, like coverage/clippy: self-hosted macOS (0 billed
    # minutes); workflow_dispatch may override to hosted Ubuntu. The job
    # reads the PR body, needs no devices, weights, or network beyond the
    # GitHub API.
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      # @modified by opencode on 2026-09-09
      - name: Check single commit
        id: single_commit
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ -z "$PR_COMMITS" ]; then
            echo "No commit count in event (manual dispatch); skipping."
            exit 0
          fi
          if [ "$PR_COMMITS" -gt 1 ]; then
            echo "PR has $PR_COMMITS commits; squash to one commit then force-push."
            echo "count=$PR_COMMITS" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "PR has one commit."
      - name: Check PR body follows the template
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          missing = []

          def section(name):
              pattern = re.compile(
                  r"^##\s+" + re.escape(name) + r"\s*$\n(.*?)(?=^##\s|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(body)
              return match.group(1) if match else None

          changed = section("What changed")
          if changed is None:
              missing.append("`## What changed` section")
          elif not changed.strip():
              missing.append("`## What changed` is empty")

          verified = section("How verified")
          if verified is None:
              missing.append("`## How verified` section")
          else:
              for label in ("cargo fmt", "cargo clippy"):
                  if not re.search(r"-\s*\[[xX]\].*" + re.escape(label), verified):
                      missing.append(f"unchecked box `{label}`")

          # The harness checkbox is owned by harness-quality-evidence.yml,
          # which enforces it based on the files changed — not here.

          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
              outputs.write(f"missing={' ; '.join(missing)}\n")

          if missing:
              print("PR body does not follow the template: " + "; ".join(missing))
              sys.exit(1)
          print("PR body follows the template.")
          EOF
      - name: Instruct author to follow the PR template
        if: failure() && steps.check.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syllabix-pr-template-help -->';
            const missing = '${{ steps.check.outputs.missing }}';
            const body = `${marker}\n` +
              `This PR body does not follow \`.github/pull_request_template.md\` yet: ${missing}.\n\n` +
              `Fill in \`## What changed\` and check every \`## How verified\` box that holds. Editing the body re-runs the check.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      # @modified by opencode on 2026-09-09
      - name: Instruct author to squash to one commit
        if: failure() && steps.single_commit.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syllabix-single-commit-help -->';
            const count = '${{ steps.single_commit.outputs.count }}';
            const body = `${marker}\n` +
              `This PR has ${count} commits; squash to one commit then force-push the PR branch.\n\n` +
              `Pushing another commit re-runs the check.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
