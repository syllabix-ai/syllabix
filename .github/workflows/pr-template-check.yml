name: PR template check

# The PR template is only a default body: `gh pr create --body`, the API,
# or the UI template-chooser bypass it silently. This check parses the PR
# body and fails until it follows `.github/pull_request_template.md`
# (non-empty What changed, How verified with checked boxes, AI attribution
# with filled AI-Agent / AI-Model lines).
# It also enforces the single-commit rule: squash the PR
# branch to one commit before pushing (re-squash after fixes).
# The harness checkbox is excluded: harness-quality-evidence.yml enforces
# it based on the files changed.
# Informational until added as a required status check.
on:
  pull_request:
    # `edited` is required: fixing the body edits it without pushing, and
    # only a re-run can turn the check green.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pool:
        description: "Runner pool (default: self-hosted, free)"
        type: choice
        default: '["self-hosted", "macOS"]'
        options:
          - '["self-hosted", "macOS"]'
          - '["ubuntu-latest"]'

# No workflow-level concurrency: each job below has its own group so the
# two jobs never cancel each other. The check runs on pushes and body
# edits (checked just before merge), not after every review.
#
# Note: resolving a thread fires no webhook event, so the threads job does
# NOT re-run on resolve. After resolving, edit the PR body to re-run it.

permissions:
  contents: read

jobs:
  pr-template-check:
    name: pr template check
    concurrency:
      group: pr-template-body-${{ github.ref }}
      cancel-in-progress: true
    # The body only changes on PR events.
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && github.event.pull_request.draft == false
    # Single runner, like coverage/clippy: self-hosted macOS (0 billed
    # minutes); workflow_dispatch may override to hosted Ubuntu. The job
    # reads the PR body, needs no devices, weights, or network beyond the
    # GitHub API.
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      # @modified by opencode on 2026-09-09
      - name: Check single commit
        id: single_commit
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ -z "$PR_COMMITS" ]; then
            echo "No commit count in event (manual dispatch); skipping."
            exit 0
          fi
          if [ "$PR_COMMITS" -gt 1 ]; then
            echo "PR has $PR_COMMITS commits; squash to one commit then force-push."
            echo "count=$PR_COMMITS" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "PR has one commit."
      - name: Check PR body follows the template
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          missing = []

          def section(name):
              pattern = re.compile(
                  r"^##\s+" + re.escape(name) + r"\s*$\n(.*?)(?=^##\s|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(body)
              return match.group(1) if match else None

          changed = section("What changed")
          if changed is None:
              missing.append("`## What changed` section")
          elif not changed.strip():
              missing.append("`## What changed` is empty")

          verified = section("How verified")
          if verified is None:
              missing.append("`## How verified` section")
          else:
              for label in ("cargo fmt", "cargo clippy"):
                  if not re.search(r"-\s*\[[xX]\].*" + re.escape(label), verified):
                      missing.append(f"unchecked box `{label}`")

          attribution = section("AI attribution")
          if attribution is None:
              missing.append("`## AI attribution` section")
          else:
              for label in ("AI-Agent", "AI-Model"):
                  m = re.search(r"^" + re.escape(label) + r"\s*:\s*(.+?)\s*$", attribution, re.MULTILINE)
                  if not m or not m.group(1).strip() or "<" in m.group(1):
                      missing.append(f"`{label}:` missing or unfilled in `## AI attribution`")

          # The harness checkbox is owned by harness-quality-evidence.yml,
          # which enforces it based on the files changed — not here.

          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
              outputs.write(f"missing={' ; '.join(missing)}\n")

          if missing:
              print("PR body does not follow the template: " + "; ".join(missing))
              sys.exit(1)
          print("PR body follows the template.")
          EOF
      - name: Instruct author to follow the PR template
        if: failure() && steps.check.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syllabix-pr-template-help -->';
            const missing = '${{ steps.check.outputs.missing }}';
            const body = `${marker}\n` +
              `This PR body does not follow \`.github/pull_request_template.md\` yet: ${missing}.\n\n` +
              `Fill in \`## What changed\` and check every \`## How verified\` box that holds. Editing the body re-runs the check.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      # @modified by opencode on 2026-09-09
      - name: Instruct author to squash to one commit
        if: failure() && steps.single_commit.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syllabix-single-commit-help -->';
            const count = '${{ steps.single_commit.outputs.count }}';
            const body = `${marker}\n` +
              `This PR has ${count} commits; squash to one commit then force-push the PR branch.\n\n` +
              `Pushing another commit re-runs the check.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  no-unresolved-threads:
    name: no unresolved threads
    # Runs only after the body check passes. Own concurrency group so the
    # two jobs never cancel each other.
    needs: pr-template-check
    concurrency:
      group: pr-threads-${{ github.ref }}
      cancel-in-progress: true
    # Same runner deal as pr-template-check above. Only reads review
    # threads via the GitHub API.
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: read
    steps:
      - name: Fail if any review thread is unresolved
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            let open = 0, total = 0, after = null;
            for (;;) {
              const data = await github.graphql(
                `query($owner:String!, $repo:String!, $pr:Int!, $after:String) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$pr) {
                      reviewThreads(first:100, after:$after) {
                        pageInfo { hasNextPage endCursor }
                        nodes { isResolved }
                      }
                    }
                  }
                }`,
                { owner, repo, pr: number, after },
              );
              const threads = data.repository.pullRequest.reviewThreads;
              total += threads.nodes.length;
              open += threads.nodes.filter((t) => !t.isResolved).length;
              if (!threads.pageInfo.hasNextPage) break;
              after = threads.pageInfo.endCursor;
            }
            if (open > 0) {
              core.setFailed(`${open} of ${total} review thread(s) unresolved. Reply to every thread and resolve it once addressed, then edit the PR body to re-run.`);
            } else {
              core.info(`All ${total} review threads resolved.`);
            }
