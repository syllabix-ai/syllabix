name: Harness quality evidence

# Phase-5 evidence gate for #125. Harness-touching PRs must carry a pasted
# `--test harness-quality harness_quality_admission` report (or the legacy
# per-pair tests). CI never calls the model and holds no secrets; the author
# runs the keyed/offline tests locally and pastes that verdict block into the PR
# body.
on:
  pull_request:
    # `edited` is required here (ci.yml omits it): pasting the report edits
    # the body without pushing, and only a re-run can turn the check green.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - crates/syllabix-core/src/executor.rs
      - crates/syllabix-core/src/openai.rs
      - crates/syllabix-core/src/types.rs
      - crates/syllabix-core/src/providers.rs
      - crates/syllabix-core/src/policy.rs
      - crates/syllabix-core/src/sandbox/**
      - crates/syllabix-core/tests/harness-quality.rs
      # contributing.md documents the paste-in-PR rule but also CI runner
      # notes; editing it must not require a live keyed admission run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness-quality-evidence:
    name: harness quality evidence
    # OS-agnostic: needs no devices, weights, or network beyond the GitHub API.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Skip the pasted-report gate when the harness files only moved imports:
      # `use` lines (including wrapped `{ A, B }` name lists), comments, braces,
      # or a type path `name: path::Type`. Any other changed line needs a report.
      - name: Check PR body for pasted harness-quality report
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import subprocess
          import sys

          body = os.environ.get("PR_BODY") or ""
          marker = "<!-- syllabix-harness-quality -->"
          sandbox_fixtures = [
              "write-denied",
              "network-denied",
              "secret-denied",
              "cancelled-command",
          ]
          pair_line = re.compile(
              r"pair=\S+\s+(?:completion=\d+/\d+\s+ratio=\d+\.\d+|skipped, no key)"
          )
          sandbox_summary = re.compile(
              r"sandbox summary:\s*completion=\d+/\d+\s+ratio=\d+\.\d+"
              r"\s+policy_violations=0\s+secret_exposures=0\s+stale_results=0"
          )
          boundary = [
              "crates/syllabix-core/src/executor.rs",
              "crates/syllabix-core/src/openai.rs",
              "crates/syllabix-core/src/types.rs",
              "crates/syllabix-core/src/providers.rs",
              "crates/syllabix-core/src/policy.rs",
              "crates/syllabix-core/src/sandbox",
              "crates/syllabix-core/tests/harness-quality.rs",
          ]
          # `name: path::Type` (at least one `::`), optional trailing comma.
          type_path = re.compile(
              r"^[A-Za-z_][A-Za-z0-9_]*:\s*[A-Za-z_][A-Za-z0-9_]*"
              r"(::[A-Za-z_][A-Za-z0-9_]*)+,?$"
          )
          # Names inside `use foo::{A, B, C}`.
          use_names = re.compile(
              r"^[A-Za-z_][A-Za-z0-9_]*(?:\s*,\s*[A-Za-z_][A-Za-z0-9_]*)*,?$"
          )

          def is_import_only_line(rest, in_use_list):
              if rest.startswith("use ") or rest.startswith("//"):
                  return True
              if rest in {"{", "}", "},", "};"}:
                  return True
              if type_path.match(rest):
                  return True
              if in_use_list and use_names.match(rest):
                  return True
              return False

          def import_only_boundary_diff():
              base = os.environ.get("BASE_SHA") or ""
              head = os.environ.get("HEAD_SHA") or ""
              if not base or not head:
                  return False
              diff = subprocess.check_output(
                  ["git", "diff", base, head, "--", *boundary],
                  text=True,
              )
              if not diff.strip():
                  return True
              in_use_list = False
              for line in diff.splitlines():
                  if not line or line.startswith(("+++", "---", "diff ", "index ", "@@")):
                      continue
                  if line[0] not in "+-":
                      continue
                  rest = line[1:].strip()
                  if not rest:
                      continue
                  if not is_import_only_line(rest, in_use_list):
                      return False
                  if rest.startswith("use "):
                      in_use_list = "{" in rest and ";" not in rest
                  elif rest in {"}", "},", "};"}:
                      in_use_list = False
              return True

          missing = []
          if marker not in body:
              missing.append("marker `<!-- syllabix-harness-quality -->`")
          for fixture in sandbox_fixtures:
              if not re.search(rf"\[{re.escape(fixture)}\].*completion=true", body):
                  missing.append(f"sandbox fixture line `[{fixture}]`")
          if not sandbox_summary.search(body):
              missing.append(
                  "sandbox summary line with completion ratio and zero policy_violations/secret_exposures/stale_results"
              )
          if not pair_line.search(body):
              missing.append("at least one `pair=` score or `skipped, no key` line")

          if missing:
              if import_only_boundary_diff():
                  print("harness-quality evidence not required: listed files only moved imports.")
                  sys.exit(0)
              print("harness-quality evidence missing: " + "; ".join(missing))
              sys.exit(1)
          print("harness-quality evidence present.")
          EOF
      - name: Instruct author to paste the harness-quality report
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syllabix-harness-quality-help -->';
            const body = `${marker}\n` +
              `This PR touches the tool-harness boundary but its body has no pasted \`--test harness-quality\` report yet.\n\n` +
              `Run admission locally (CI never calls the model, no secrets are stored). Paste the capability verdict block — marker \`<!-- syllabix-harness-quality -->\`, the four sandbox fixture lines (\`[write-denied]\`, \`[network-denied]\`, \`[secret-denied]\`, \`[cancelled-command]\`), the \`sandbox summary: …\` line, and one \`pair=\` line per agent+model pair you ran (or \`skipped, no key\` for online pairs without a key):\n\n` +
              "```bash\n" +
              "cargo test -p syllabix-core --test harness-quality harness_quality_admission -- --ignored --nocapture\n" +
              "# offline pairs only (no API key):\n" +
              "SYLLABIX_HARNESS_PAIRS=offline \\\n" +
              "  cargo test -p syllabix-core --test harness-quality harness_quality_admission -- --ignored --nocapture\n" +
              "```";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
