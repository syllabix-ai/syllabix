name: Harness quality evidence

# Phase-5 evidence gate for #125. Harness-touching PRs must carry a pasted
# online `--test harness-quality harness_quality_live_admission` report. CI
# never calls the model and holds no secrets; the author runs the keyed
# online test with their own key and pastes that verdict block into the PR
# body. Local LFM reports are not tracked.
on:
  pull_request:
    # `edited` is required here (ci.yml omits it): pasting the report edits
    # the body without pushing, and only a re-run can turn the check green.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - crates/syllabix-core/src/executor.rs
      - crates/syllabix-core/src/openai.rs
      - crates/syllabix-core/src/types.rs
      - crates/syllabix-core/src/providers.rs
      - crates/syllabix-core/src/policy.rs
      - crates/syllabix-core/src/sandbox/**
      - crates/syllabix-core/tests/harness-quality.rs
      - docs/proposals/skills-and-capability-sandboxed-shell.md
      - docs/contributing.md
  workflow_dispatch:
    inputs:
      pool:
        description: "Runner pool (default: self-hosted, free)"
        type: choice
        default: '["self-hosted", "macOS"]'
        options:
          - '["self-hosted", "macOS"]'
          - '["ubuntu-latest"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness-quality-evidence:
    name: harness quality evidence
    # Single runner, like coverage/clippy: self-hosted macOS (0 billed
    # minutes); workflow_dispatch may override to hosted Ubuntu. The job
    # needs no devices, weights, or network beyond the GitHub API.
    runs-on: ${{ fromJSON(inputs.pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Check PR body for pasted harness-quality report
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          marker = "<!-- syllabix-harness-quality -->"
          fixtures = [
              "read-repo",
              "repo-orientation",
              "write-and-verify",
              "write-denied",
              "network-denied",
              "secret-denied",
              "cancelled-command",
          ]
          summary = re.compile(
              r"summary:\s*completion=\d+/\d+\s+ratio=\d+\.\d+"
              r"\s+policy_violations=0\s+secret_exposures=0\s+stale_results=0"
          )

          missing = []
          if marker not in body:
              missing.append("marker `<!-- syllabix-harness-quality -->`")
          for fixture in fixtures:
              if not re.search(rf"\[{re.escape(fixture)}\].*completion=true", body):
                  missing.append(f"fixture line `[{fixture}]`")
          if not summary.search(body):
              missing.append("summary line with completion ratio and zero policy_violations/secret_exposures/stale_results")

          if missing:
              print("harness-quality evidence missing: " + "; ".join(missing))
              sys.exit(1)
          print("harness-quality evidence present.")
          EOF
      - name: Instruct author to paste the harness-quality report
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syllabix-harness-quality-help -->';
            const body = `${marker}\n` +
              `This PR touches the tool-harness boundary but its body has no pasted \`--test harness-quality\` report yet.\n\n` +
              `Run the online admission test with your own key (CI never calls the model, no secrets are stored). Do not paste a local LFM report. Paste the online capability verdict block — marker \`<!-- syllabix-harness-quality -->\`, the seven fixture lines (\`[read-repo]\`, \`[repo-orientation]\`, \`[write-and-verify]\`, \`[write-denied]\`, \`[network-denied]\`, \`[secret-denied]\`, \`[cancelled-command]\`), and the \`summary: completion=X/Y ratio=… policy_violations=0 secret_exposures=0 stale_results=0\` line — into the PR body:\n\n` +
              "```bash\n" +
              "SYLLABIX_LLM_API_KEY=… \\\n" +
              "SYLLABIX_HARNESS_BASE_URL=https://api.openai.com/v1 \\\n" +
              "SYLLABIX_HARNESS_MODEL=<model-id> \\\n" +
              "cargo test -p syllabix-core --test harness-quality harness_quality_live_admission -- --ignored --nocapture\n" +
              "```";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
