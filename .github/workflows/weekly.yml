name: Weekly full check

# Full cross-platform safety net: Linux/Windows on GitHub-hosted runners,
# macOS on the self-hosted runner (Apple Silicon, 0 billed minutes). When
# the Mac is offline, manually dispatch with the hosted pool for that run.
# The per-PR fast gate (fmt / clippy / coverage) lives in ci.yml on
# GitHub-hosted Linux. Native-weight coverage is a separate weekly
# workflow: native-tests.yml.

on:
  schedule:
    - cron: "0 06 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      macos_pool:
        description: "Runner pool for the macOS leg (default: self-hosted, free)"
        type: choice
        default: '["self-hosted", "macOS"]'
        options:
          - '["self-hosted", "macOS"]'
          - '["macos-latest"]'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SYLLABIX_CACHE_DIR: ${{ github.workspace }}/.syllabix-cache

# A scheduled run superseded by a manual run (or vice versa) is cancelled so
# both never bill at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Each leg runs to completion even if another fails, so one red OS
      # never hides the results of the others. The macOS leg is a separate
      # job and already runs independently of this matrix.
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Compile dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh
      # Ubuntu 24.04 AppArmor blocks CAP_NET_ADMIN inside unprivileged userns,
      # so bwrap --unshare-net fails with RTM_NEWADDR and sandbox tests fail.
      - name: Allow bubblewrap user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.syllabix-cache
          key: syllabix-models-v2-${{ runner.os }}-whisper-small-lfm2.5-2.6b-qwen3.5-0.8b-qwen3.5-2b-llama-3.2-1b-pocket-tts
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Unit and CLI tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Release compile
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Check undeclared dynamic libraries
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-dynamic-libs.sh
          scripts/check-dynamic-libs.sh "target/${{ matrix.target }}/release/syllabix"
      - name: Check one shared ggml
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-one-ggml.sh
          scripts/check-one-ggml.sh "target/${{ matrix.target }}/release/syllabix"

  # macOS leg, self-hosted only (0 billed minutes): native Apple-Silicon
  # test plus Intel cross-compile check. Scheduled runs always use the
  # self-hosted Mac; when it is offline, manually dispatch this workflow
  # with the hosted pool for that run.
  test-macos:
    name: test / macos-arm64
    runs-on: ${{ fromJSON(inputs.macos_pool || '["self-hosted", "macOS"]') }}
    timeout-minutes: 40
    env:
      # Self-hosted macOS runners ship Homebrew Rust; rustup-init otherwise
      # refuses to install the pinned toolchain over it. Harmless on hosted.
      RUSTUP_INIT_SKIP_PATH_CHECK: yes
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # dtolnay/rust-toolchain only prepends ~/.cargo/bin when it installs
      # rustup. On a self-hosted Mac rustup already exists, so Homebrew
      # rustc/cargo stay first on PATH without this. Harmless on hosted.
      - name: Prefer rustup over Homebrew rustc
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Compile dependencies (macOS)
        run: ./scripts/setup-macos.sh
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.syllabix-cache
          key: syllabix-models-v2-${{ runner.os }}-whisper-small-lfm2.5-2.6b-qwen3.5-0.8b-qwen3.5-2b-llama-3.2-1b-pocket-tts
      # Cache only when dispatched to the hosted pool. The self-hosted
      # runner keeps target/ on disk between runs, so restore always missed
      # while every green job uploaded ~1 GB over the home uplink (see ci.yml).
      - uses: Swatinem/rust-cache@v2
        if: contains(inputs.macos_pool || '', 'macos-latest')
        with:
          key: macos-arm64
      - name: Unit and CLI tests
        run: cargo test --workspace --target aarch64-apple-darwin
      - name: Release compile
        run: cargo build --workspace --release --target aarch64-apple-darwin
      - name: Cross-compile macOS Intel
        run: cargo build --workspace --release --target x86_64-apple-darwin

  # Dist packaging and GitHub Release attach live in release.yml (v* tags only).
