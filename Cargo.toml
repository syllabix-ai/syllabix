[workspace]
resolver = "2"
members = ["crates/syllabix", "crates/syllabix-core", "crates/syllabix-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/syllabix-ai/syllabix"
homepage = "https://github.com/syllabix-ai/syllabix"
rust-version = "1.91"
# Default stays unpublished (CLI, examples, helpers). syllabix-core and
# syllabix-native set publish = true so a version tag can upload them.
publish = false

[workspace.dependencies]
# Keep the dependency graph deterministic across the target matrix.
clap = { version = "=4.5.23", features = ["derive"] }
thiserror = "=2.0.17"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
syllabix-core = { path = "crates/syllabix-core" }
assert_cmd = "=2.0.16"
predicates = "=3.1.2"
cpal = "=0.15.3"
sonora = "=0.2.0"
# Keep the CoreAudio bindings aligned with cpal 0.15.
coreaudio-sys = "=0.2.16"
# rustls-backed HTTP so the binary does not pick up libssl.
# Stay on ureq 2.x; rustls is selected through Cargo.lock.
ureq = { version = "=2.10.1", default-features = false, features = ["tls"] }
sha2 = "=0.10.8"
url = "=2.5.8"
zeroize = "=1.8.1"
jobserver = "=0.1.35"
# Direct getrandom 0.2 for pocket-tts; 0.4 is a different API.
getrandom = "=0.2.17"
# Exact serialization pins keep generated config stable.
serde = { version = "=1.0.217", features = ["derive"] }
serde_yaml = "=0.9.34"
# Row 30: SSE chat-completions payloads for the OpenAI-compatible adapter.
serde_json = "=1.0.134"
# Moonshine streaming-small uses a 32k BPE tokenizer.json.
# Drop esaxx_fast: its C++ build forces /MT on MSVC, which LNK2038-conflicts
# with whisper/llama (/MD, matching rustc). Moonshine is BPE, not Unigram, so
# the C++ esaxx pretok is unused.
tokenizers = { version = "=0.22.1", default-features = false, features = ["progressbar", "onig"] }
# Web-fetch HTML reaches the model as Markdown, not raw tag soup.
htmd = "=0.5.5"
ort-sys = "=2.0.0-rc.9"
# Live `run` UI is crossterm (inline status/transcript), not a widget TUI.
crossterm = "=0.27.0"
# Blocking HTTP listen for `syllabix serve`. No async runtime.
tiny_http = "=0.12.0"
# One CPU-only ggml, shared by whisper.cpp and llama.cpp. GPU/Metal/CUDA
# stay off so the binary keeps the declared dynamic-library set.
# path for this checkout; version so crates.io can resolve syllabix-core.
# The crates.io publish job sets this and [workspace.package] version from
# the git tag. Do not bump by hand.
syllabix-native = { path = "crates/syllabix-native", version = "0.1.0" }
# Optional Moshi Ogg/Opus path (`s2s-opus`). Off by default; not under `cloud`.
opus = "=0.4.0"
ogg = "=0.9.1"

# Installable artifacts (V0_LAUNCH sequence 22). Default `release` stays the
# CI / `ci-local.sh` profile so everyday checks do not pay thin LTO.
# `strip = "debuginfo"` keeps `nm` able to prove one `ggml_new_tensor`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
