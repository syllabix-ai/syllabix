[workspace]
resolver = "2"
members = ["crates/syllabix", "crates/syllabix-core"]

# Isolate llama.cpp's ggml symbols so they do not collide with whisper.cpp.
[patch.crates-io]
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/syllabix-ai/syllabix"
rust-version = "1.83"

[workspace.dependencies]
# Pin below crates.io "requires Rust 1.85" so CI and this image stay on 1.83.
clap = { version = "=4.5.23", features = ["derive"] }
thiserror = "=2.0.11"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
syllabix-core = { path = "crates/syllabix-core" }
assert_cmd = "=2.0.16"
predicates = "=3.1.2"
cpal = "=0.15.3"
# 0.2.18 requires edition 2024 (Rust 1.85+); macOS CI stays on 1.83.
coreaudio-sys = "=0.2.16"
# rustls-backed HTTP so the binary does not pick up libssl.
# ureq 2.12 + url 2.5.4 pull idna 1.x / edition 2024, which Cargo 1.83 cannot parse.
ureq = { version = "=2.10.1", default-features = false, features = ["tls"] }
sha2 = "=0.10.8"
url = "=2.5.2"
idna = "=0.5.0"
zeroize = "=1.8.1"
# jobserver 0.1.33+ pulls getrandom 0.3/0.4 (edition 2024) on Windows.
jobserver = "=0.1.32"
getrandom = "=0.2.17"
# CPU-only whisper.cpp. GPU/Metal/CUDA stay off so the binary keeps the
# declared dynamic-library set (libc, libstdc++, ALSA).
whisper-rs = { version = "=0.15.1", default-features = false }
# CPU-only llama.cpp. Default features pull OpenMP (`libgomp`); keep them off.
# Metal is still auto-enabled by the crate on macOS Apple Silicon.
llama-cpp-2 = { version = "=0.1.154", default-features = false }
encoding_rs = "=0.8.35"
